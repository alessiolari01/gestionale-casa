[package]
name = "gestionale-casa"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
# Gia' presente nel grafo tramite teloxide-core con le stesse feature:
# dichiararlo diretto non aggiunge nulla al binario.
chrono = { version = "0.4", default-features = false }
dotenvy = "0.15"
# Gia' nel grafo tramite teloxide-core: qui si aggiunge solo la feature
# "json", per leggere Open Food Facts e Open Prices (consegna B).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Lettura del codice a barre dalla foto (18 settembre 2026): solo il
# decodificatore 1D, senza il crate "image" e senza i suoi formati, altrimenti
# il grafo cresce di 82 crate invece di 13 -- e a compilare e' un telefono.
rxing = { version = "0.9.3", default-features = false, features = ["oned", "decoders", "no_character_set_support"] }
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
teloxide = { version = "0.17", default-features = false, features = ["rustls", "ctrlc_handler"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2.5.8"
# Le foto di Telegram sono JPEG: questo le porta a pixel, il resto lo fa rxing.
zune-jpeg = "0.5.15"

# Solo per i test: genera un codice a barre vero da rileggere, cosi' la
# lettura e' provata davvero e non a parole. Non entra nel binario.
[dev-dependencies]
rxing = { version = "0.9.3", default-features = false, features = ["oned", "decoders", "encoders", "no_character_set_support"] }

# Perche' questi profili sono nel progetto e non solo in `aggiorna-s9.sh`.
#
# Il 1 settembre un `cargo run` dato a mano sull'S9 ha fatto segfaultare il
# linker. Il motivo era che le impostazioni anti-memoria vivevano soltanto
# come variabili d'ambiente esportate dallo script: chi compila senza passare
# dallo script ottiene i default di cargo, cioe' 256 unita' di codegen e le
# informazioni di debug complete. Il linker si e' trovato 257 file oggetto
# pieni di debuginfo da unire, su un telefono. Le impostazioni che proteggono
# la build devono stare nel progetto, non in chi lo lancia.
#
# `debug = 0` e' gia' quello che usano sia la CI sia l'S9: qui smette solo di
# essere una cosa da ricordarsi. `codegen-units = 16` porta i file oggetto da
# 257 a una ventina, che e' il fattore che conta davvero per il linker.
#
# Il flag `--threads=1` per il linker su Android non e' qui perche' Cargo.toml
# non sa distinguere i target: lo emette `build.rs`, solo quando serve.

[profile.dev]
debug = 0
codegen-units = 16

# I proc-macro e i build script si compilano per la macchina che compila, e
# non seguono il profilo qui sopra: hanno il loro. Senza questo, sul telefono
# arrivavano con le informazioni di debug complete, ed e' li' che il linker e'
# finito senza memoria il 18 settembre 2026 (`rxing-one-d-proc-derive`).
[profile.dev.build-override]
debug = 0
opt-level = 0
codegen-units = 16

# Il profilo `test` erediterebbe da `dev`, ma il binario di test contiene
# l'intero progetto in un solo eseguibile ed e' il piu' pesante da linkare:
# meglio dichiararlo, cosi' resta vero anche se `dev` cambia.
[profile.test]
debug = 0
codegen-units = 16

[profile.test.build-override]
debug = 0
opt-level = 0
codegen-units = 16
