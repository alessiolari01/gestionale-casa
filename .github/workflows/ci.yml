name: Rust CI

on:
  # Ogni ramo, non solo quelli che si chiamano in un certo modo.
  #
  # Il filtro era `[main, 'step-*']`, nato quando i rami si chiamavano
  # `step-7-...`. Il ramo `ux-convenzioni-telegram` non combaciava, quindi sei
  # push di seguito non hanno fatto partire nessun controllo: il verde arrivava
  # solo dalla pull request, cioe' quando gli errori da bisezionare erano gia'
  # sei. Un filtro sui nomi dei rami e' una rete che si buca appena si cambia
  # convenzione di nome.
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Su una raffica di push allo stesso ramo tiene solo l'ultimo controllo: e' la
# meta' del costo di girare su tutti i rami.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  quality:
    name: Format, check, test and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable with quality components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Coerenza dei documenti
        run: ./scripts/controlla-documenti.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --locked

      - name: Run tests
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
